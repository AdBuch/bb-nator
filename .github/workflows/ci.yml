name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
permissions:
  contents: read
jobs:
  backend:
    name: Backend · Java 21 / Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and unit tests
        working-directory: backend
        run: mvn -B --no-transfer-progress clean verify

  frontend:
    name: Frontend · Angular 22 / Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: frontend
        run: npm run test:ci
      - name: Production build
        working-directory: frontend
        run: npm run build

  smoke:
    name: Docker · End-to-end smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral test config
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-strong-random-password/ci-only-not-a-real-secret-1234/' .env
          docker compose config --quiet
      - name: Build and start containers
        run: docker compose up --build -d
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and remove test data
        if: always()
        run: docker compose down -v --remove-orphans
