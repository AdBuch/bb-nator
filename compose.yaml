name: bb-nator
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bbnator}
      POSTGRES_USER: ${POSTGRES_USER:-bbnator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbnator} -d ${POSTGRES_DB:-bbnator}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      BBNATOR_DEMO_ACKNOWLEDGED: ${BBNATOR_DEMO_ACKNOWLEDGED:-true}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-bbnator}
      # Runtime connects as bbnator_app (no superuser, no BYPASSRLS) so row-level security applies.
      DB_USER: bbnator_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      # Flyway migrates as the database owner.
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-bbnator}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BBNATOR_TENANT_ID: ${BBNATOR_TENANT_ID:-local}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      BBNATOR_BOOTSTRAP_ADMIN: ${BBNATOR_BOOTSTRAP_ADMIN:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE: ${LDAP_BASE:-}
      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE:-ou=people}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER:-(uid={0})}
      LDAP_SUBJECT_ATTRIBUTE: ${LDAP_SUBJECT_ATTRIBUTE:-uid}
      LDAP_MANAGER_DN: ${LDAP_MANAGER_DN:-}
      LDAP_MANAGER_PASSWORD: ${LDAP_MANAGER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/index.html"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
